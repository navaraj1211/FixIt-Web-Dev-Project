<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login — FixIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/user.css">
  <style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 140px);
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      font-size: 1.6rem;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">⚡</div>
        <span>FixIt</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="register.html" class="btn btn-outline btn-sm">Create Account</a></li>
      </ul>
    </div>
  </header>

  <!-- Login Main -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon" style="margin: 0 auto 1rem auto;">⚡</div>
        <h2>Welcome Back</h2>
        <p>Log in to report problems and track your issues</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          Log In to FixIt
        </button>
      </form>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="font-weight: 600;">Register here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <div>FixIt — Complaint & Issue Reporting System</div>
      <div><a href="admin-login.html" style="color: var(--text-muted);">Admin Portal</a></div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const result = loginUser(email, password);
      if (result.success) {
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          if (result.user.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 800);
      } else {
        showToast(result.message, 'error');
      }
    });
  </script>
</body>
</html>
