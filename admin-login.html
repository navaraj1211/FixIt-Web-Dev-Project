<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — FixIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-auth-page">
    <div class="admin-auth-card">
      <div class="admin-auth-badge">🔒 Admin Portal</div>
      <h2>Administrator Sign In</h2>
      <p style="margin-bottom: 1.75rem;">Restricted access for facility management staff only.</p>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" class="form-control" placeholder="admin@fixit.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="admin-password">Password</label>
          <input type="password" id="admin-password" class="form-control" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem; background: #6366f1;">
          Log In to Admin Console
        </button>
      </form>

      <!-- Admin Demo Credentials -->
      <div style="margin-top: 1.25rem; padding: 0.85rem; background: rgba(99, 102, 241, 0.12); border-radius: var(--radius-md); border: 1px solid rgba(99, 102, 241, 0.3); font-size: 0.82rem; text-align: left;">
        <div style="font-weight: 700; color: #a5b4fc; margin-bottom: 0.25rem;">🔒 Predefined Admin Account:</div>
        <div style="color: #cbd5e1;">Email: <code>admin@fixit.com</code></div>
        <div style="color: #cbd5e1;">Password: <code>Admin@123</code></div>
        <button type="button" id="fill-admin-demo" class="btn btn-secondary btn-sm" style="margin-top: 0.5rem; width: 100%; font-size: 0.78rem; padding: 0.35rem; background: #1e293b; color: #cbd5e1; border-color: #334155;">Auto-Fill Admin Login</button>
      </div>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem;">
        <a href="login.html" style="color: #94a3b8;">Are you a resident/user? Go to User Login →</a>
      </div>
      <div style="margin-top: 0.5rem; text-align: center; font-size: 0.85rem;">
        <a href="index.html" style="color: #64748b;">← Back to FixIt Home</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('fill-admin-demo')?.addEventListener('click', () => {
      document.getElementById('admin-email').value = 'admin@fixit.com';
      document.getElementById('admin-password').value = 'Admin@123';
    });

    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;

      const result = loginAdmin(email, password);
      if (result.success) {
        showToast('Welcome back, admin! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 700);
      } else {
        showToast(result.message, 'error');
      }
    });
  </script>
</body>
</html>
