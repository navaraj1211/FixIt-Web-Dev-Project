<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — FixIt</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">⚡</div>
        <span>FixIt</span>
      </a>
      <ul class="nav-links">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="report.html" class="nav-link">Report Problem</a></li>
        <li><a href="complaints.html" class="nav-link">My Reports</a></li>
        <li><a href="profile.html" class="nav-link active">Profile</a></li>
        <li><a href="#" class="btn btn-outline btn-sm btn-logout">Logout</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="profile-card">
      <div class="profile-avatar" id="profile-initial">U</div>
      <h2 id="profile-name">User Name</h2>
      <p style="margin-bottom: 1.5rem;">FixIt account details</p>

      <div class="profile-field">
        <div class="profile-field-label">Email Address</div>
        <div class="profile-field-value" id="profile-email"></div>
      </div>
      <div class="profile-field">
        <div class="profile-field-label">Account Role</div>
        <div class="profile-field-value" id="profile-role"></div>
      </div>
      <div class="profile-field">
        <div class="profile-field-label">Total Reports Submitted</div>
        <div class="profile-field-value" id="profile-report-count"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <div>FixIt — Complaint & Issue Reporting System</div>
      <div>Logged in as: <strong class="current-user-name">User</strong></div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/user.js"></script>
</body>
</html>
